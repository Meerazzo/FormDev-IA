# ============================================================
# FormDev IA - Docker Compose
# ============================================================
# Default command starts the local/dev stack:
#   docker compose --env-file infra/.env -f infra/docker-compose.yml up -d --build
#
# Optional profiles:
#   docker compose --profile prod --env-file infra/.env -f infra/docker-compose.yml up -d --build
#   docker compose --profile observability --env-file infra/.env -f infra/docker-compose.yml up -d
# ============================================================

x-api-build: &api-build
  context: ..
  dockerfile: apps/api/Dockerfile

x-common-api-env: &common-api-env
  VLLM_BASE_URL: http://inference:${VLLM_PORT}
  API_KEYS: ${API_KEYS}
  RATE_LIMIT_RPM: ${RATE_LIMIT_RPM}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  QDRANT_EMBEDDING_MODEL: ${QDRANT_EMBEDDING_MODEL}
  QDRANT_VECTOR_SIZE: ${QDRANT_VECTOR_SIZE}
  REDIS_PORT: 6379
  REDIS_DB: 0
  RQ_DEFAULT_TIMEOUT: ${RQ_DEFAULT_TIMEOUT}
  RQ_RESULT_TTL: ${RQ_RESULT_TTL}
  RQ_FAILURE_TTL: ${RQ_FAILURE_TTL}
  RAG_QDRANT_COLLECTION: ${RAG_QDRANT_COLLECTION}
  RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL}
  RAG_VECTOR_SIZE: ${RAG_VECTOR_SIZE}
  RAG_DEFAULT_TOP_K: ${RAG_DEFAULT_TOP_K}
  RAG_URL_PARSER_BACKEND: ${RAG_URL_PARSER_BACKEND:-basic}
  RAG_CRAWL4AI_LIGHT_CLEANING: ${RAG_CRAWL4AI_LIGHT_CLEANING:-true}
  RAG_MIN_RELEVANT_SCORE: ${RAG_MIN_RELEVANT_SCORE:-0.55}
  RAG_SCORE_THRESHOLD: ${RAG_SCORE_THRESHOLD:-0.25}
  RAG_RETRIEVAL_CANDIDATE_MULTIPLIER: ${RAG_RETRIEVAL_CANDIDATE_MULTIPLIER:-4}
  RAG_MAX_CHUNKS_PER_SOURCE: ${RAG_MAX_CHUNKS_PER_SOURCE:-2}
  RAG_MAX_CONTEXT_CHARS: ${RAG_MAX_CONTEXT_CHARS:-6000}
  RAG_CHUNK_SIZE: ${RAG_CHUNK_SIZE}
  RAG_CHUNK_OVERLAP: ${RAG_CHUNK_OVERLAP}
  RQ_RAG_QUEUE: ${RQ_RAG_DEV_QUEUE}
  SURVEY_PURGE_AFTER_FEEDBACK: ${SURVEY_PURGE_AFTER_FEEDBACK:-false}
  GRAYLOG_ENABLED: ${GRAYLOG_ENABLED:-false}
  GRAYLOG_HOST: graylog
  GRAYLOG_PORT: 12201
  GRAYLOG_FACILITY: formdev-ia

x-dev-api-env: &dev-api-env
  <<: *common-api-env
  APP_ENV: dev
  DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-dev:5432/${POSTGRES_DEV_DB}
  QDRANT_URL: http://qdrant-dev:6333
  QDRANT_COLLECTION: ${QDRANT_DEV_COLLECTION}
  REDIS_HOST: redis-dev
  RQ_SURVEY_QUEUE: ${RQ_SURVEY_DEV_QUEUE}
  RQ_RAG_QUEUE: ${RQ_RAG_DEV_QUEUE}
  RAG_STORAGE_DIR: /data/rag

x-prod-api-env: &prod-api-env
  <<: *common-api-env
  APP_ENV: prod
  DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-prod:5432/${POSTGRES_PROD_DB}
  QDRANT_URL: http://qdrant-prod:6333
  QDRANT_COLLECTION: ${QDRANT_PROD_COLLECTION}
  REDIS_HOST: redis-prod
  RQ_SURVEY_QUEUE: ${RQ_SURVEY_PROD_QUEUE}
  RQ_RAG_QUEUE: ${RQ_RAG_PROD_QUEUE}
  RAG_STORAGE_DIR: /data/rag

x-worker-healthcheck: &worker-healthcheck
  test: ["CMD-SHELL", "python -c \"import os, redis; redis.Redis(host=os.environ['REDIS_HOST'], port=int(os.getenv('REDIS_PORT', 6379)), db=int(os.getenv('REDIS_DB', 0))).ping()\""]
  interval: 10s
  timeout: 5s
  start_period: 5s
  retries: 3

services:
  # ----------------------------------------------------------
  # Shared inference service
  # ----------------------------------------------------------
  inference:
    image: vllm/vllm-openai:latest
    entrypoint: []
    command:
      - vllm
      - serve
      - ${MODEL_ID}
      - --served-model-name
      - ${MODEL_ID}
      - --dtype
      - ${DTYPE}
      - --max-model-len
      - "${MAX_MODEL_LEN}"
      - --gpu-memory-utilization
      - "0.92"
      - --generation-config
      - vllm
      - --host
      - 0.0.0.0
      - --port
      - "${VLLM_PORT}"
    volumes:
      - ${HF_CACHE}:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ipc: host
    restart: unless-stopped

  # ----------------------------------------------------------
  # Dev stack - default profile
  # ----------------------------------------------------------
  postgres-dev:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DEV_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_DEV_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DEV_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    restart: unless-stopped

  qdrant-dev:
    image: qdrant/qdrant:latest
    ports:
      - "${QDRANT_DEV_HTTP_PORT}:6333"
      - "${QDRANT_DEV_GRPC_PORT}:6334"
    volumes:
      - qdrant_dev_storage:/qdrant/storage
    restart: unless-stopped

  redis-dev:
    image: redis:8
    restart: unless-stopped

  api-dev:
    build: *api-build
    environment: *dev-api-env
    ports:
      - "${API_DEV_PORT}:8080"
    depends_on:
      postgres-dev:
        condition: service_healthy
      inference:
        condition: service_started
      qdrant-dev:
        condition: service_started
      redis-dev:
        condition: service_started
    volumes:
      - ../apps/api:/app
      - rag_data_dev:/data/rag
    restart: unless-stopped

  worker-survey-dev:
    build: *api-build
    environment: *dev-api-env
    depends_on:
      postgres-dev:
        condition: service_healthy
      inference:
        condition: service_started
      qdrant-dev:
        condition: service_started
      redis-dev:
        condition: service_started
    volumes:
      - ../apps/api:/app
    command: ["python", "-m", "workers.survey_worker"]
    healthcheck: *worker-healthcheck
    restart: unless-stopped

  worker-rag-dev:
    build: *api-build
    environment: *dev-api-env
    depends_on:
      postgres-dev:
        condition: service_healthy
      inference:
        condition: service_started
      qdrant-dev:
        condition: service_started
      redis-dev:
        condition: service_started
    volumes:
      - ../apps/api:/app
      - rag_data_dev:/data/rag
    command: ["python", "-m", "workers.rag_worker"]
    healthcheck: *worker-healthcheck
    restart: unless-stopped

  # ----------------------------------------------------------
  # Prod-like stack - optional profile: prod
  # ----------------------------------------------------------
  postgres-prod:
    profiles: ["prod"]
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_PROD_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PROD_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_PROD_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    restart: unless-stopped

  qdrant-prod:
    profiles: ["prod"]
    image: qdrant/qdrant:latest
    ports:
      - "${QDRANT_PROD_HTTP_PORT}:6333"
      - "${QDRANT_PROD_GRPC_PORT}:6334"
    volumes:
      - qdrant_prod_storage:/qdrant/storage
    restart: unless-stopped

  redis-prod:
    profiles: ["prod"]
    image: redis:8
    restart: unless-stopped

  api-prod:
    profiles: ["prod"]
    build: *api-build
    environment: *prod-api-env
    ports:
      - "${API_PROD_PORT}:8080"
    depends_on:
      postgres-prod:
        condition: service_healthy
      inference:
        condition: service_started
      qdrant-prod:
        condition: service_started
      redis-prod:
        condition: service_started
    volumes:
      - ../apps/api:/app
      - rag_data_prod:/data/rag
    restart: unless-stopped

  worker-survey-prod:
    profiles: ["prod"]
    build: *api-build
    environment: *prod-api-env
    depends_on:
      postgres-prod:
        condition: service_healthy
      inference:
        condition: service_started
      qdrant-prod:
        condition: service_started
      redis-prod:
        condition: service_started
    volumes:
      - ../apps/api:/app
    command: ["python", "-m", "workers.survey_worker"]
    healthcheck: *worker-healthcheck
    restart: unless-stopped

  worker-rag-prod:
    profiles: ["prod"]
    build: *api-build
    environment: *prod-api-env
    depends_on:
      postgres-prod:
        condition: service_healthy
      inference:
        condition: service_started
      qdrant-prod:
        condition: service_started
      redis-prod:
        condition: service_started
    volumes:
      - ../apps/api:/app
      - rag_data_prod:/data/rag
    command: ["python", "-m", "workers.rag_worker"]
    healthcheck: *worker-healthcheck
    restart: unless-stopped

  # ----------------------------------------------------------
  # Observability - optional profile: observability
  # ----------------------------------------------------------
  mongo-graylog:
    profiles: ["observability"]
    image: mongo:6
    volumes:
      - mongo_graylog_data:/data/db
    restart: unless-stopped

  opensearch-graylog:
    profiles: ["observability"]
    image: opensearchproject/opensearch:2.15.0
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_INITIAL_ADMIN_PASSWORD:-change-me}
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - opensearch_graylog_data:/usr/share/opensearch/data
    restart: unless-stopped

  graylog:
    profiles: ["observability"]
    image: graylog/graylog:5.2
    environment:
      GRAYLOG_PASSWORD_SECRET: ${GRAYLOG_PASSWORD_SECRET}
      GRAYLOG_ROOT_PASSWORD_SHA2: ${GRAYLOG_ROOT_PASSWORD_SHA2}
      GRAYLOG_HTTP_EXTERNAL_URI: ${GRAYLOG_HTTP_EXTERNAL_URI:-http://localhost:9000/}
      GRAYLOG_MONGODB_URI: mongodb://mongo-graylog:27017/graylog
      GRAYLOG_ELASTICSEARCH_HOSTS: http://opensearch-graylog:9200
    depends_on:
      - mongo-graylog
      - opensearch-graylog
    ports:
      - "${GRAYLOG_HTTP_PORT}:9000"
      - "${GRAYLOG_GELF_UDP_PORT}:12201/udp"
    volumes:
      - graylog_journal:/usr/share/graylog/data/journal
    restart: unless-stopped

volumes:
  postgres_dev_data:
  postgres_prod_data:
  qdrant_dev_storage:
  qdrant_prod_storage:
  mongo_graylog_data:
  opensearch_graylog_data:
  graylog_journal:
  rag_data_dev:
  rag_data_prod:
