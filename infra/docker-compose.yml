services:
  inference:
    image: vllm/vllm-openai:latest
    entrypoint: []
    command:
      vllm serve ${MODEL_ID}
      --served-model-name ${MODEL_ID}
      --dtype ${DTYPE}
      --max-model-len ${MAX_MODEL_LEN}
      --gpu-memory-utilization 0.92
      --generation-config vllm
      --host 0.0.0.0
      --port ${VLLM_PORT}
    volumes:
      - ${HF_CACHE}:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ipc: host
    restart: unless-stopped

  postgres-dev:
    image: postgres:16
    environment:
      - POSTGRES_DB=${POSTGRES_DEV_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_DEV_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DEV_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    restart: unless-stopped

  qdrant-dev:
    image: qdrant/qdrant
    ports:
      - "${QDRANT_DEV_HTTP_PORT}:6333"
      - "${QDRANT_DEV_GRPC_PORT}:6334"
    volumes:
      - qdrant_dev_storage:/qdrant/storage
    restart: unless-stopped

  redis-dev:
    image: redis:8
    restart: unless-stopped

  postgres-prod:
    image: postgres:16
    environment:
      - POSTGRES_DB=${POSTGRES_PROD_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PROD_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_PROD_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    restart: unless-stopped

  qdrant-prod:
    image: qdrant/qdrant
    ports:
      - "${QDRANT_PROD_HTTP_PORT}:6333"
      - "${QDRANT_PROD_GRPC_PORT}:6334"
    volumes:
      - qdrant_prod_storage:/qdrant/storage
    restart: unless-stopped

  redis-prod:
    image: redis:8
    restart: unless-stopped
  
  mongo-graylog:
    image: mongo:6
    volumes:
      - mongo_graylog_data:/data/db
    restart: unless-stopped

  opensearch-graylog:
    image: opensearchproject/opensearch:2.15.0
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=Admin123!
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - opensearch_graylog_data:/usr/share/opensearch/data
    restart: unless-stopped

  graylog:
    image: graylog/graylog:5.2
    environment:
      - GRAYLOG_PASSWORD_SECRET=${GRAYLOG_PASSWORD_SECRET}
      - GRAYLOG_ROOT_PASSWORD_SHA2=${GRAYLOG_ROOT_PASSWORD_SHA2}
      - GRAYLOG_HTTP_EXTERNAL_URI=http://192.168.64.50:${GRAYLOG_HTTP_PORT}/
      - GRAYLOG_MONGODB_URI=mongodb://mongo-graylog:27017/graylog
      - GRAYLOG_ELASTICSEARCH_HOSTS=http://opensearch-graylog:9200
    depends_on:
      - mongo-graylog
      - opensearch-graylog
    ports:
      - "${GRAYLOG_HTTP_PORT}:9000"
      - "${GRAYLOG_GELF_UDP_PORT}:12201/udp"
    volumes:
      - graylog_journal:/usr/share/graylog/data/journal
    restart: unless-stopped

  api-dev:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      - VLLM_BASE_URL=http://inference:${VLLM_PORT}
      - API_KEYS=${API_KEYS}
      - RATE_LIMIT_RPM=${RATE_LIMIT_RPM}
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-dev:5432/${POSTGRES_DEV_DB}
      - QDRANT_URL=http://qdrant-dev:6333
      - QDRANT_COLLECTION=${QDRANT_DEV_COLLECTION}
      - QDRANT_EMBEDDING_MODEL=${QDRANT_EMBEDDING_MODEL}
      - QDRANT_VECTOR_SIZE=${QDRANT_VECTOR_SIZE}
      - REDIS_HOST=redis-dev
      - REDIS_PORT=6379
      - REDIS_DB=0
      - RQ_SURVEY_QUEUE=${RQ_SURVEY_DEV_QUEUE}
      - RQ_DEFAULT_TIMEOUT=${RQ_DEFAULT_TIMEOUT}
      - RQ_RESULT_TTL=${RQ_RESULT_TTL}
      - RQ_FAILURE_TTL=${RQ_FAILURE_TTL}
      - SURVEY_PURGE_AFTER_FEEDBACK=${SURVEY_PURGE_AFTER_FEEDBACK:-false}
      - APP_ENV=dev
      - GRAYLOG_ENABLED=${GRAYLOG_ENABLED:-false}
      - GRAYLOG_HOST=graylog
      - GRAYLOG_PORT=12201
      - GRAYLOG_FACILITY=formdev-ia
    ports:
      - "${API_DEV_PORT}:8080"
    depends_on:
      postgres-dev:
        condition: service_healthy
      inference:
        condition: service_started
      qdrant-dev:
        condition: service_started
      redis-dev:
        condition: service_started
    volumes:
      - ../apps/api:/app
    restart: unless-stopped

  worker-survey-dev:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      - VLLM_BASE_URL=http://inference:${VLLM_PORT}
      - API_KEYS=${API_KEYS}
      - RATE_LIMIT_RPM=${RATE_LIMIT_RPM}
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-dev:5432/${POSTGRES_DEV_DB}
      - QDRANT_URL=http://qdrant-dev:6333
      - QDRANT_COLLECTION=${QDRANT_DEV_COLLECTION}
      - QDRANT_EMBEDDING_MODEL=${QDRANT_EMBEDDING_MODEL}
      - QDRANT_VECTOR_SIZE=${QDRANT_VECTOR_SIZE}
      - REDIS_HOST=redis-dev
      - REDIS_PORT=6379
      - REDIS_DB=0
      - RQ_SURVEY_QUEUE=${RQ_SURVEY_DEV_QUEUE}
      - RQ_DEFAULT_TIMEOUT=${RQ_DEFAULT_TIMEOUT}
      - RQ_RESULT_TTL=${RQ_RESULT_TTL}
      - RQ_FAILURE_TTL=${RQ_FAILURE_TTL}
      - APP_ENV=dev
      - GRAYLOG_ENABLED=${GRAYLOG_ENABLED:-false}
      - GRAYLOG_HOST=graylog
      - GRAYLOG_PORT=12201
      - GRAYLOG_FACILITY=formdev-ia
    depends_on:
      postgres-dev:
        condition: service_healthy
      inference:
        condition: service_started
      qdrant-dev:
        condition: service_started
      redis-dev:
        condition: service_started
    volumes:
      - ../apps/api:/app
    command: ["python", "-m", "workers.survey_worker"]
    restart: unless-stopped

  api-prod:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      - VLLM_BASE_URL=http://inference:${VLLM_PORT}
      - API_KEYS=${API_KEYS}
      - RATE_LIMIT_RPM=${RATE_LIMIT_RPM}
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-prod:5432/${POSTGRES_PROD_DB}
      - QDRANT_URL=http://qdrant-prod:6333
      - QDRANT_COLLECTION=${QDRANT_PROD_COLLECTION}
      - QDRANT_EMBEDDING_MODEL=${QDRANT_EMBEDDING_MODEL}
      - QDRANT_VECTOR_SIZE=${QDRANT_VECTOR_SIZE}
      - REDIS_HOST=redis-prod
      - REDIS_PORT=6379
      - REDIS_DB=0
      - RQ_SURVEY_QUEUE=${RQ_SURVEY_PROD_QUEUE}
      - RQ_DEFAULT_TIMEOUT=${RQ_DEFAULT_TIMEOUT}
      - RQ_RESULT_TTL=${RQ_RESULT_TTL}
      - RQ_FAILURE_TTL=${RQ_FAILURE_TTL}
      - SURVEY_PURGE_AFTER_FEEDBACK=${SURVEY_PURGE_AFTER_FEEDBACK:-false}
      - APP_ENV=prod
      - GRAYLOG_ENABLED=${GRAYLOG_ENABLED:-false}
      - GRAYLOG_HOST=graylog
      - GRAYLOG_PORT=12201
      - GRAYLOG_FACILITY=formdev-ia
    ports:
      - "${API_PROD_PORT}:8080"
    depends_on:
      postgres-prod:
        condition: service_healthy
      inference:
        condition: service_started
      qdrant-prod:
        condition: service_started
      redis-prod:
        condition: service_started
    volumes:
      - ../apps/api:/app
    restart: unless-stopped

  worker-survey-prod:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      - VLLM_BASE_URL=http://inference:${VLLM_PORT}
      - API_KEYS=${API_KEYS}
      - RATE_LIMIT_RPM=${RATE_LIMIT_RPM}
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-prod:5432/${POSTGRES_PROD_DB}
      - QDRANT_URL=http://qdrant-prod:6333
      - QDRANT_COLLECTION=${QDRANT_PROD_COLLECTION}
      - QDRANT_EMBEDDING_MODEL=${QDRANT_EMBEDDING_MODEL}
      - QDRANT_VECTOR_SIZE=${QDRANT_VECTOR_SIZE}
      - REDIS_HOST=redis-prod
      - REDIS_PORT=6379
      - REDIS_DB=0
      - RQ_SURVEY_QUEUE=${RQ_SURVEY_PROD_QUEUE}
      - RQ_DEFAULT_TIMEOUT=${RQ_DEFAULT_TIMEOUT}
      - RQ_RESULT_TTL=${RQ_RESULT_TTL}
      - RQ_FAILURE_TTL=${RQ_FAILURE_TTL}
      - APP_ENV=prod
      - GRAYLOG_ENABLED=${GRAYLOG_ENABLED:-false}
      - GRAYLOG_HOST=graylog
      - GRAYLOG_PORT=12201
      - GRAYLOG_FACILITY=formdev-ia
    depends_on:
      postgres-prod:
        condition: service_healthy
      inference:
        condition: service_started
      qdrant-prod:
        condition: service_started
      redis-prod:
        condition: service_started
    volumes:
      - ../apps/api:/app
    command: ["python", "-m", "workers.survey_worker"]
    restart: unless-stopped

volumes:
  postgres_dev_data:
  postgres_prod_data:
  qdrant_dev_storage:
  qdrant_prod_storage:
  mongo_graylog_data:
  opensearch_graylog_data:
  graylog_journal: