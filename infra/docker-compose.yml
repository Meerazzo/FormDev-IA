services:
  inference:
    image: vllm/vllm-openai:latest
    entrypoint: []
    command:
      vllm serve ${MODEL_ID}
      --served-model-name ${MODEL_ID}
      --dtype ${DTYPE}
      --max-model-len ${MAX_MODEL_LEN}
      --gpu-memory-utilization 0.92
      --generation-config vllm
      --host 0.0.0.0
      --port ${VLLM_PORT}
    volumes:
      - ${HF_CACHE}:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ipc: host
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  redis:
    image: redis:8
    ports:
      - "6379:6379"
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      - VLLM_BASE_URL=http://inference:${VLLM_PORT}
      - API_KEYS=${API_KEYS}
      - RATE_LIMIT_RPM=${RATE_LIMIT_RPM}
      - DATABASE_URL=${DATABASE_URL}
      - QDRANT_URL=${QDRANT_URL}
      - QDRANT_COLLECTION=${QDRANT_COLLECTION}
      - QDRANT_EMBEDDING_MODEL=${QDRANT_EMBEDDING_MODEL}
      - QDRANT_VECTOR_SIZE=${QDRANT_VECTOR_SIZE}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - RQ_SURVEY_QUEUE=survey
      - RQ_DEFAULT_TIMEOUT=3600
    ports:
      - "${API_PORT}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      inference:
        condition: service_started
      qdrant:
        condition: service_started
      redis:
        condition: service_started
    volumes:
      - ../apps/api:/app
    restart: unless-stopped

  worker-survey:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      - VLLM_BASE_URL=http://inference:${VLLM_PORT}
      - API_KEYS=${API_KEYS}
      - RATE_LIMIT_RPM=${RATE_LIMIT_RPM}
      - DATABASE_URL=${DATABASE_URL}
      - QDRANT_URL=${QDRANT_URL}
      - QDRANT_COLLECTION=${QDRANT_COLLECTION}
      - QDRANT_EMBEDDING_MODEL=${QDRANT_EMBEDDING_MODEL}
      - QDRANT_VECTOR_SIZE=${QDRANT_VECTOR_SIZE}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - RQ_SURVEY_QUEUE=survey
      - RQ_DEFAULT_TIMEOUT=3600
    depends_on:
      postgres:
        condition: service_healthy
      inference:
        condition: service_started
      qdrant:
        condition: service_started
      redis:
        condition: service_started
    volumes:
      - ../apps/api:/app
    command: ["python", "-m", "workers.survey_worker"]
    restart: unless-stopped

volumes:
  postgres_data:
  qdrant_storage: